services:
  db:
    build: db/.
    ports:
      - "33060:3306"
    # Healthy only once the world database is loaded and queryable over TCP.
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-pexample",
             "-e", "SELECT 1 FROM world.city LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Keep the R07-R11 report files after the container stops (CI uploads them as an artifact).
    volumes:
      - ./reports:/tmp/reports
